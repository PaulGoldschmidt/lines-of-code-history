name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  action:
    name: Run the action on this repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./
        id: loc
        with:
          path: loc-history.svg
          exclude: package-lock.json
      - run: |
          test -s loc-history.svg
          echo "total lines: ${{ steps.loc.outputs.total_lines }}"
      - uses: actions/upload-artifact@v4
        with:
          name: loc-history
          path: loc-history.svg
