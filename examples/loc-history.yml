# Regenerates loc-history.svg from the full git history and commits it,
# so the chart can be embedded in the README as a plain relative image:
#   ![Lines of code over time](./loc-history.svg)
name: Lines of code history

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1' # weekly, so the line keeps extending to "now"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the whole history is needed

      - uses: PaulGoldschmidt/lines-of-code-history@main
        id: loc
        with:
          path: loc-history.svg
          theme: auto
          exclude: package-lock.json,**/*.lock,vendor/**

      - name: Commit the chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add loc-history.svg
          git diff --cached --quiet || git commit -m "update lines of code chart (${{ steps.loc.outputs.total_lines }} lines)"
          git push
